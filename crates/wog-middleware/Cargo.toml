[package]
name = "wog-middleware"
version = "0.1.0"
edition = "2024"

[dependencies]
wog-infras = { path = "../wog-infras" }
wog-oauth = { path = "../wog-oauth" }

axum = "0.8.8"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
dashmap = "6"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["time"] }