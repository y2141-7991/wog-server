[package]
name = "wog-infras"
version = "0.1.0"
edition = "2024"

[dependencies]
wog-oauth = { path = "../wog-oauth"}

anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2.0.18"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
envconfig = "0.11.1"
tracing = "0.1.44"
tokio = "1.50.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = "0.5"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "pool", "hostname", "builder"] }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
sha2 = "0.10"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
