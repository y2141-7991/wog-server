[package]
name = "wog-config"
version = "0.1.0"
edition = "2024"

[dependencies]
wog-infras = { path = "../wog-infras" }


serde = { version = "1", features = ["derive"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
async-trait = "0.1.89"
envconfig = "0.11.1"
utoipa = { version = "5.4.0", features = ["uuid", "chrono", "axum_extras", "decimal"] }
rust_decimal = "1.40.0"
chrono = { version = "0.4.44", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["rust_decimal"] }
